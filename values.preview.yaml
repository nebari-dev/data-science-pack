# Static overrides for k8s-preview.yaml's ephemeral deploy. PR-specific
# values (hostname, external-url) are passed as --set flags at deploy time.
jupyterhub:
  hub:
    image:
      name: nebari-data-science-pack-jupyterhub
      tag: preview
    # jupyterhub.hub.extraVolumes in values.yaml hardcodes secretName for
    # a "data-science-pack" release; override for this release ("preview").
    extraVolumes:
      - name: custom-config
        configMap:
          name: nebari-data-science-pack-hub-config
      - name: oauth-client
        secret:
          secretName: preview-nebari-data-science-pack-oidc-client
          optional: true
      - name: org-ca
        configMap:
          name: nebari-trust-bundle
          optional: true
      - name: ca-merged
        emptyDir: {}
  # Blocks install on pre-pulling the singleuser image; the PR's
  # jupyterlab tag may not exist yet -- disable so deploy doesn't fail
  # outright, image pulls lazily on spawn instead.
  prePuller:
    hook:
      enabled: false
  custom:
    profiles:
      - slug: micro-instance
        display_name: "Micro Instance"
        description: "0.5 CPU / 1 GB RAM: quick checks, smoke tests, reviewing a change."
        default: true
        kubespawner_override:
          cpu_limit: 0.5
          cpu_guarantee: 0.25
          mem_limit: "1G"
          mem_guarantee: "512M"
      - slug: small-instance
        display_name: "Small Instance"
        description: "1 CPU / 2 GB RAM: interactive notebooks, light data exploration."
        kubespawner_override:
          cpu_limit: 1
          cpu_guarantee: 0.5
          mem_limit: "2G"
          mem_guarantee: "1G"
nebariapp:
  enabled: true
keycloak:
  # hub's own token exchange can't go through Cloudflare Access (no
  # browser session) -- route it in-cluster instead.
  backchannelURL: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080"
