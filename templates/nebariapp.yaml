{{- if .Values.nebariapp.enabled -}}
{{- $spec := omit .Values.nebariapp "enabled" -}}
{{- if (not $spec.hostname) -}}
  {{- /* we cannot put this into the values directly, because nebariapp.hostname is used in multiple places in this chart */ -}}
  {{- $defaultHostname := required "Set keycloak.hostname (for auto-derivation) or nebariapp.hostname explicitly." (include "nebari-data-science-pack.hubHostname" .) -}}
  {{- $_ := set $spec "hostname" $defaultHostname -}}
{{- end -}}
{{- include "nebari-app.nebariApp" (dict
    "metadata" (dict
      "name"      (include "nebari-data-science-pack.fullname" .)
      "namespace" .Release.Namespace
      "labels"    (include "nebari-data-science-pack.labels" . | fromYaml)
    )
    "spec" $spec
) -}}
{{- end }}
