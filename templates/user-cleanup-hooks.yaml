{{/*
User cleanup hooks for the Nebari operator's lifecycle API.

When a user is deleted in Keycloak the operator creates a UserDeletion and
runs one Job per registered hook, in this namespace, with the user id,
username and stage injected as NEBARI_* env vars. Two hooks here:

  - disable: stop the user's running servers through the hub API.
    Runs as soon as the deletion is picked up.
  - delete: remove the hub user record and the per-user PVCs.
    Runs once the operator's grace period passed.

Both use the token of the ``user-cleanup`` hub service
declared in values.yaml. The pod label is what the hub NetworkPolicy
admits. PVC names assume a plain lowercase username; anything KubeSpawner
has to escape (emails, uppercase) will not match.

Gated on ``nebariapp.enabled`` like the NebariApp itself: without the
operator the CRD does not exist and the install would fail.
*/}}
{{- if .Values.nebariapp.enabled }}
{{- $name :=printf "%s-user-cleanup" (include "nebari-data-science-pack.fullname" .) }}
{{- $image := "alpine/k8s:1.34.12" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebari-data-science-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebari-data-science-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-cleanup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebari-data-science-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
---
apiVersion: lifecycle.nebari.dev/v1alpha1
kind: UserCleanupHook
metadata:
  name: {{ $name }}-disable
  labels:
    {{- include "nebari-data-science-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-cleanup
spec:
  stage: disable
  template:
    metadata:
      labels:
        hub.jupyter.org/network-access-hub: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      containers:
        - name: cleanup
          image: {{ $image }}
          env:
            - name: JUPYTERHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hub
                  key: hub.services.user-cleanup.apiToken
          command:
            - sh
            - -c
            - |
              set -eu
              api="http://hub:8081/hub/api"
              auth="Authorization: token $JUPYTERHUB_API_TOKEN"
              user="$NEBARI_KEYCLOAK_USERNAME"

              code=$(curl -s -o /tmp/user.json -w '%{http_code}' -H "$auth" "$api/users/$user")
              if [ "$code" = 404 ]; then
                echo "user $user is unknown to the hub, nothing to stop"
                exit 0
              fi
              [ "$code" = 200 ] || { echo "hub returned $code"; exit 1; }

              # Default server is the "" key, named servers everything else.
              jq -r '.servers | keys[]' /tmp/user.json | while IFS= read -r server; do
                if [ -z "$server" ]; then
                  path="$api/users/$user/server"
                else
                  path="$api/users/$user/servers/$server"
                fi
                if [ "${NEBARI_CLEANUP_DRY_RUN:-false}" = true ]; then
                  echo "dry run: would stop ${server:-default} server for $user"
                  continue
                fi
                echo "stopping ${server:-default} server for $user"
                curl -sf -X DELETE -H "$auth" "$path" > /dev/null
              done
---
apiVersion: lifecycle.nebari.dev/v1alpha1
kind: UserCleanupHook
metadata:
  name: {{ $name }}-delete
  labels:
    {{- include "nebari-data-science-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-cleanup
spec:
  stage: delete
  template:
    metadata:
      labels:
        hub.jupyter.org/network-access-hub: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      containers:
        - name: cleanup
          image: {{ $image }}
          env:
            - name: JUPYTERHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hub
                  key: hub.services.user-cleanup.apiToken
          command:
            - sh
            - -c
            - |
              set -eu
              api="http://hub:8081/hub/api"
              auth="Authorization: token $JUPYTERHUB_API_TOKEN"
              user="$NEBARI_KEYCLOAK_USERNAME"
              pvcs="claim-$user nebi-workspaces-$user"

              if [ "${NEBARI_CLEANUP_DRY_RUN:-false}" = true ]; then
                echo "dry run: would delete hub user $user and PVCs $pvcs"
                exit 0
              fi

              # Deleting the user also stops any server still running.
              code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" "$api/users/$user")
              case "$code" in
                204) echo "deleted hub user $user" ;;
                404) echo "user $user is unknown to the hub" ;;
                *) echo "hub returned $code"; exit 1 ;;
              esac

              kubectl delete pvc $pvcs --ignore-not-found
{{- end }}
